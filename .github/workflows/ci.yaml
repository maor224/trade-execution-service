name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry flake8 bandit
          poetry install --no-root

      - name: Run flake8
        run: flake8 . --max-line-length=100

      - name: Run Bandit Security Checks
        run: bandit -r .

      - name: Run tests
        run: poetry run pytest --maxfail=5 --disable-warnings

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: image-tag
        run: |
          DATE=$(date +%Y.%m.%d)
          REPO_NAME=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-_')
          if [[ $GITHUB_REF == "refs/heads/main" ]]; then
            IMAGE_TAG="maorbar/${REPO_NAME}:${DATE}"
          else
            COMMIT_HASH=$(git rev-parse --short HEAD)
            IMAGE_TAG="maorbar/${REPO_NAME}:${DATE}-${COMMIT_HASH}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_TAG }}
